<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check your changes</title>
<!-- The after-game review. Opened by the app on top of everything (games
     included) when CS2 closes with changes waiting, or when NVIDIA settings
     were changed outside the app -- see cs2cfg/history.py and desktop.py.
     Same idea as the match-found alert: it blinks until it is answered. -->
<link rel="stylesheet" href="assets/hardware/icons.css">
<link rel="stylesheet" href="assets/changes/changes.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #07050d; --panel: rgba(19, 12, 31, .9); --panel-2: rgba(30, 20, 46, .92);
    --ink: #ece8f7; --ink-dim: rgba(236, 232, 247, .8); --muted: rgba(236, 232, 247, .66);
    --faint: rgba(236, 232, 247, .45); --line: rgba(167, 139, 250, .22);
    --accent: #8b5cf6; --accent-dim: rgba(139, 92, 246, .18);
    --good: #35d07f; --warn: #ffb43a; --bad: #ff5468;
    --flash: var(--warn);
  }
  :root.light {
    color-scheme: light;
    --bg: #eef0f4; --panel: #ffffff; --panel-2: #f6f7fa;
    --ink: #15121f; --ink-dim: rgba(21, 18, 31, .8); --muted: rgba(21, 18, 31, .62);
    --faint: rgba(21, 18, 31, .42); --line: rgba(21, 18, 31, .14);
    --good: #11864a; --warn: #b66a00; --bad: #c8243b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .frame { box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
    border: 2px solid var(--flash); border-radius: 12px;
    background: radial-gradient(120% 70% at 50% -10%, color-mix(in srgb, var(--flash) 16%, transparent), transparent 60%), var(--bg);
    animation: blink 1.1s ease-in-out infinite; }
  /* The blink: the border and a glow from the edge, like the match alert.
     It stops once anything is answered, so it never nags while you read. */
  @keyframes blink {
    50% { box-shadow: inset 0 0 46px color-mix(in srgb, var(--flash) 38%, transparent);
          border-color: color-mix(in srgb, var(--flash) 45%, transparent); }
  }
  .frame.calm { animation: none; }
  @media (prefers-reduced-motion: reduce) { .frame { animation-duration: 2.6s; } }

  header { display: flex; align-items: center; gap: 14px; padding: 18px 22px 12px;
    -webkit-app-region: drag; user-select: none; }
  .bell { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    color: var(--flash); background: color-mix(in srgb, var(--flash) 16%, transparent); flex: 0 0 auto; }
  .bell .hw-icon, .bell svg { width: 26px; height: 26px; display: inline-flex; }
  .head { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--flash); font-weight: 700; }
  h1 { margin: 2px 0 0; font-size: 22px; }
  .say { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .x { -webkit-app-region: no-drag; appearance: none; border: 0; background: none; color: var(--muted);
    font-size: 20px; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; }
  .x:hover { background: var(--panel-2); color: var(--ink); }

  main { flex: 1; overflow: auto; padding: 4px 22px 12px; }
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 22px 18px;
    border-top: 1px solid var(--line); }
  footer .note { flex: 1; font-size: 12px; color: var(--muted); min-height: 16px; }
  footer .note.bad { color: var(--bad); }
  button.btn { font: inherit; font-weight: 700; font-size: 13px; border-radius: 8px; padding: 10px 18px;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--good); border-color: var(--good); color: #05130b; min-width: 150px; }
  button.btn.danger { color: var(--bad); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .chist-items { margin-left: 45px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <header>
    <span class="bell" id="bell"></span>
    <div class="head">
      <div class="eyebrow" id="eyebrow">Your game has closed</div>
      <h1 id="title">Check your changes</h1>
      <p class="say" id="say">These changed during your last game. Keep them, or put them back the way they were before.</p>
    </div>
    <button class="x" id="later-x" title="Ask me later" aria-label="Ask me later">&#x2715;</button>
  </header>
  <main id="list"><div class="chist-empty">Loading&hellip;</div></main>
  <footer>
    <div class="note" id="note"></div>
    <button class="btn" id="later">Ask me later</button>
    <button class="btn danger" id="all-back">Put everything back</button>
    <button class="btn primary" id="all-keep">Keep everything</button>
  </footer>
</div>
<script src="assets/hardware/icons.js"></script>
<script src="assets/changes/changes.js"></script>
<script>
const TOKEN = "__CS2CFG_TOKEN__";
const $ = (id) => document.getElementById(id);
const LIGHT = ["daylight", "paper"];
const ACCENTS = { violet: "#8b5cf6", ember: "#f5a524", carbon: "#c3d0de", acid: "#39ff88",
  crimson: "#e31837", frost: "#00b8fc", neon: "#ec4899", daylight: "#6d28d9", paper: "#9a5b00", pro: "#ff5500" };
async function post(path, body) {
  const res = await fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json", "X-CS2CFG-Token": TOKEN },
    body: JSON.stringify(body || {}) });
  return res.json().catch(() => ({ ok: false, error: "The app did not answer." }));
}
const view = { entries: [], open: {}, conflicts: {} };

function words(entries) {
  const kinds = new Set(entries.map(e => e.kind === "app" && e.origin.includes("while CS2") ? "game" : e.kind));
  if (kinds.size === 1 && kinds.has("nvidia")) {
    return ["Changed outside the app", "NVIDIA settings changed",
            "Something changed these in the NVIDIA app or the NVIDIA Control Panel. Keep them if that was you."];
  }
  return ["Your game has closed", "Check your changes",
          "These changed during your last game. Keep them, or put them back the way they were before."];
}

function draw() {
  const [eyebrow, title, say] = words(view.entries);
  $("eyebrow").textContent = eyebrow;
  $("title").textContent = title;
  $("say").textContent = say;
  $("list").innerHTML = ChangeList.render(view.entries, {
    open: view.open, conflicts: view.conflicts, empty: "All answered. You can close this window." });
  const any = view.entries.length > 0;
  $("all-keep").disabled = !any;
  $("all-back").disabled = !any || !view.entries.some(e => e.can_put_back);
  $("all-keep").textContent = any ? "Keep everything" : "Done";
  if (!any) $("all-keep").disabled = false;
}

async function load() {
  const r = await post("/api/history", { waiting: true });
  view.entries = (r && r.entries) || [];
  draw();
}

async function answer(list) {
  $("frame").classList.add("calm");
  $("note").classList.remove("bad");
  $("note").textContent = "Saving…";
  const r = await post("/api/history/answer", { answers: list });
  for (const c of (r.conflicts || [])) view.conflicts[c.id] = c.error;
  if (r.problems && r.problems.length) {
    $("note").classList.add("bad");
    $("note").textContent = r.problems[0];
  } else if (r.conflicts && r.conflicts.length) {
    $("note").textContent = "One change needs a second look.";
  } else {
    $("note").textContent = "";
  }
  await load();
  if (!view.entries.length && !(r.problems || []).length) close();
}

function close() { post("/api/history/later"); }

document.addEventListener("click", e => {
  const a = e.target.closest("[data-chist-answer]");
  if (a) { answer([{ id: a.dataset.id, choice: a.dataset.chistAnswer }]); return; }
  const f = e.target.closest("[data-chist-force]");
  if (f) { delete view.conflicts[f.dataset.chistForce];
           answer([{ id: f.dataset.chistForce, choice: "back", force: true }]); return; }
  const m = e.target.closest("[data-chist-more]");
  if (m) { view.open[m.dataset.chistMore] = !view.open[m.dataset.chistMore]; draw(); return; }
});
$("all-keep").onclick = () => view.entries.length
  ? answer(view.entries.map(e => ({ id: e.id, choice: "keep" }))) : close();
$("all-back").onclick = () => answer(view.entries.map(e => ({ id: e.id, choice: "back" })));
$("later").onclick = close;
$("later-x").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

(async () => {
  try {
    const prefs = await (await fetch("/api/prefs")).json();
    const theme = (prefs && prefs.ui && prefs.ui.theme) || "violet";
    if (LIGHT.includes(theme)) document.documentElement.classList.add("light");
    const accent = ACCENTS[theme];
    if (accent) document.documentElement.style.setProperty("--accent", accent);
  } catch (e) { /* the default look */ }
  $("bell").innerHTML = hwIcon("history");
  await load();
})();
</script>
</body>
</html>
